", "core": "contained-by", "category": "structural"}, {"from": "Invariant.SingleCurrency", "predicate": "constrains", "to": "Concept.Order", "core": "governs", "category": "behavioral"}, {"from": "Invariant.SingleCurrency", "predicate": "scoped-to", "to": "BC.Ordering", "core": "contained-by", "category": "structural"}, {"from": "Issue.023", "predicate": "blocks", "to": "Capability.Refund", "core": "depended-on-by", "category": "traceability"}, {"from": "Issue.023", "predicate": "evidenced-by", "to": "Evidence.OrderSchema", "core": "evidenced-by", "category": "traceability"}, {"from": "Policy.PaymentChangesReviewed", "predicate": "established-by", "to": "ADR.011", "core": "established-by", "category": "traceability"}, {"from": "Policy.PaymentChangesReviewed", "predicate": "governs", "to": "Workflow.Checkout", "core": "governs", "category": "behavioral"}, {"from": "Skill.SettlePayment", "predicate": "produces", "to": "Artifact.PaymentService", "core": "implements", "category": "structural"}, {"from": "Skill.SettlePayment", "predicate": "requires", "to": "Concept.Payment", "core": "depends-on", "category": "traceability"}, {"from": "Skill.ValidateOrder", "predicate": "produces", "to": "Artifact.CheckoutService", "core": "implements", "category": "structural"}, {"from": "Skill.ValidateOrder", "predicate": "requires", "to": "Concept.Order", "core": "depends-on", "category": "traceability"}, {"from": "Workflow.Checkout", "predicate": "has-step", "to": "WorkflowStep.Checkout.1", "core": "contains", "category": "structural"}, {"from": "Workflow.Checkout", "predicate": "has-step", "to": "WorkflowStep.Checkout.2", "core": "contains", "category": "structural"}, {"from": "Workflow.Checkout", "predicate": "passes-through", "to": "Gate.PaymentReview", "core": "validated-by", "category": "behavioral"}, {"from": "WorkflowStep.Checkout.1", "predicate": "executes", "to": "Skill.ValidateOrder", "core": "executes", "category": "behavioral"}, {"from": "WorkflowStep.Checkout.1", "predicate": "step-of", "to": "Workflow.Checkout", "core": "contained-by", "category": "structural"}, {"from": "WorkflowStep.Checkout.2", "predicate": "executes", "to": "Skill.SettlePayment", "core": "executes", "category": "behavioral"}, {"from": "WorkflowStep.Checkout.2", "predicate": "step-of", "to": "Workflow.Checkout", "core": "contained-by", "category": "structural"}], "vocabulary": {"accepted-by": {"category": "traceability", "means": "A was granted status by act B", "inverse": "accepts"}, "accepts": {"category": "traceability", "means": "inverse of accepted-by", "inverse": "accepted-by"}, "contained-by": {"category": "structural", "means": "inverse of contains", "inverse": "contains"}, "contains": {"category": "structural", "means": "A is a container for B", "inverse": "contained-by"}, "depended-on-by": {"category": "traceability", "means": "inverse of depends-on", "inverse": "depends-on"}, "depends-on": {"category": "traceability", "means": "A cannot proceed without B", "inverse": "depended-on-by"}, "derived-into": {"category": "semantic", "means": "inverse of derives-from", "inverse": "derives-from"}, "derives-from": {"category": "semantic", "means": "A is obtained from B", "inverse": "derived-into"}, "established-by": {"category": "traceability", "means": "A exists because of decision B", "inverse": "establishes"}, "establishes": {"category": "traceability", "means": "inverse of established-by", "inverse": "established-by"}, "evidenced-by": {"category": "traceability", "means": "A is supported by observable B", "inverse": "supports"}, "executes": {"category": "behavioral", "means": "A carries out B", "inverse": "executed-by"}, "governs": {"category": "behavioral", "means": "A constrains B normatively", "inverse": "governed-by"}, "implemented-by": {"category": "structural", "means": "inverse of implements", "inverse": "implements"}, "implements": {"category": "structural", "means": "A realises what B describes", "inverse": "implemented-by"}, "references": {"category": "structural", "means": "A points at B without owning it", "inverse": "referenced-by"}, "represents": {"category": "semantic", "means": "A stands for B in another representation", "inverse": "represented-by"}, "resolves": {"category": "traceability", "means": "A answers open question B", "inverse": "resolved-by"}, "superseded-by": {"category": "traceability", "means": "inverse of supersedes", "inverse": "supersedes"}, "validated-by": {"category": "behavioral", "means": "inverse of validates", "inverse": "validates"}, "validates": {"category": "behavioral", "means": "A checks that B holds", "inverse": "validated-by"}}, "statistics": {"nodes": 28, "edges": 52, "byType": {"ADR": 2, "AcceptanceRecord": 1, "Actor": 2, "Artifact": 4, "ArtifactRevision": 2, "BoundedContext": 1, "Capability": 2, "Concept": 2, "EngineeringGate": 1, "Evidence": 2, "Invariant": 2, "Issue": 1, "Policy": 1, "Skill": 2, "Workflow": 1, "WorkflowStep": 2}, "byFamily": {"descriptive": 17, "operational": 11}, "byCategory": {"behavioral": 10, "semantic": 5, "structural": 22, "traceability": 15}, "byCoreType": {"accepted-by": 3, "accepts": 1, "contained-by": 10, "contains": 2, "depended-on-by": 1, "depends-on": 2, "derived-into": 2, "derives-from": 2, "established-by": 1, "establishes": 2, "evidenced-by": 3, "executes": 3, "governs": 3, "implemented-by": 2, "implements": 2, "references": 6, "represents": 1, "resolves": 1, "superseded-by": 1, "validated-by": 2, "validates": 2}}};

const out = id => CKM.edges.filter(e => e.from === id);

let current = null, query = 'relationships';

const DERIVES = new Set(['derives-from', 'derived-into', 'implements', 'implemented-by']);

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function link(id){const o=byId[id];return `<a class="link" onclick="show('${id}')">${esc(o?o.label:id)}</a>`}

/* ---- semantic navigation (ADR-0079) ---------------------------------- */

// Transitive closure. Returns [{id, hops, via}] excluding the start node.
function closure(startId, step){
  const seen = new Map(), queue = [[startId, 0, null]];
  while (queue.length) {
    const [id, hops, via] = queue.shift();
    for (const e of step(id)) {
      const next = e.from === id ? e.to : e.from;
      if (next === startId || seen.has(next)) continue;
      seen.set(next, {id: next, hops: hops + 1, via: via || e.predicate});
      queue.push([next, hops + 1, via || e.predicate]);
    }
  }
  return [...seen.values()].sort((a,b) => a.hops - b.hops || a.id.localeCompare(b.id));
}

const QUERIES = {

    why: 'Every edge, with the core type and category that explain why it exists.',

            const v = VOC[e.core] || {};
            return `<tr><td><code>${esc(e.predicate)}</code></td>

      };
      return `<h3>Outgoing</h3>${rows('out')}<h3>Incoming</h3>${rows('in')}`;

    }
  },
  derived: {
    label: 'Derived from this',
    why: 'Everything obtained from this node, transitively, following derivation and realisation edges.',
    render(id){
      const found = closure(id, nid => inc(nid).filter(e => DERIVES.has(e.core)));
      if (!found.length) return '<p class="empty">Nothing derives from this node.</p>';
      return `<div class="tbl-wrap"><table><tr><th>Node</th><th>Type</th><th>Hops</th><th>Via</th></tr>`
        + found.map(f => `<tr><td>${link(f.id)}</td><td>${esc(byId[f.id].type)}</td>
          <td>${f.hops}</td><td><code>${esc(f.via)}</code></td></tr>`).join('') + '</table></div>';
    }
  },
  impact: {
    label: 'Impact if changed',
    why: 'Everything that references this node, transitively. Anything reachable by an incoming edge may be affected.',
    render(id){
      const found = closure(id, inc);
      if (!found.length) return '<p class="empty">Nothing references this node. Changing it affects nothing else in the model.</p>';
      const direct = found.filter(f => f.hops === 1).length;
      return `<p class="hop"><b>${found.length}</b> node(s) affected &mdash; ${direct} directly,
        ${found.length - direct} transitively.</p>
        <div class="tbl-wrap"><table><tr><th>Node</th><th>Type</th><th>Hops</th><th>First edge</th></tr>`
        + found.map(f => `<tr><td>${link(f.id)}</td><td>${esc(byId[f.id].type)}</td>
          <td>${f.hops}</td><td><code>${esc(f.via)}</code></td></tr>`).join('') + '</table></div>';
    }
  },
  rationale: {
    label: 'Rationale',
    why: 'Which decision established this, and whether that decision still stands.',
    render(id){
      const adrs = inc(id).filter(e => e.core === 'establishes'
        && (byId[e.from]||{}).type === 'ADR');
      if (!adrs.length) return `<p class="empty">No ADR establishes this node.
        Its reason is unrecorded.</p>`;
      return `<div class="tbl-wrap"><table><tr><th>Decision</th><th>Via</th><th>Still stands?</th></tr>`
        + adrs.map(e => {
            const sup = out(e.from).find(x => x.predicate === 'superseded-by');
            return `<tr><td>${link(e.from)}</td><td><code>${esc(e.predicate)}</code></td>
              <td>${sup ? 'superseded by ' + link(sup.to) : 'yes'}</td></tr>`;
          }).join('') + '</table></div>';
    }
  },
  status: {
    label: 'Implementation status',
    why: 'Whether the revisions of this node are Active. Acceptance confers Active status; commits do not (ADR-0018).',
    render(id){
      let revs = out(id).filter(e => e.predicate === 'has-active-revision').map(e => e.to);
      if (!revs.length) revs = [id];
      return `<div class="tbl-wrap"><table><tr><th>Revision</th><th>Accepted by</th><th>Active</th></tr>`
        + revs.map(r => {
            const acc = inc(r).filter(e => (byId[e.from]||{}).type === 'AcceptanceRecord');
            return `<tr><td>${link(r)}</td>
              <td>${acc.length ? acc.map(e => link(e.from)).join(', ') : '<span class="empty">none</span>'}</td>
              <td>${acc.length ? 'yes' : '<b>no</b>'}</td></tr>`;
          }).join('') + '</table></div>';
    }
  },
  affected: {
    label: 'Affected artifacts',
    why: 'Tests that validate this, and specifications that represent it. Both become inconsistent when it changes.',
    render(id){
      const reach = new Set([id, ...closure(id, inc).map(f => f.id)]);
      const tests = CKM.nodes.filter(n => out(n.id).some(e => e.core === 'validates' && reach.has(e.to)));
      const specs = inc(id).filter(e => e.core === 'represents').map(e => byId[e.from]).filter(Boolean);
      const sect = (title, list, note) => `<h3>${title}</h3>` + (list.length
        ? '<div class="tbl-wrap"><table>' + list.map(n =>
            `<tr><td>${link(n.id)}</td><td class="hop">${esc(n.type)}</td></tr>`).join('') + '</table></div>'
        : '<p class="empty">None.</p>') + `<div class="hop">${note}</div>`;
      return sect('Tests', tests, 'A test is an Artifact that <code>validates</code> another. There is no Test entity.')
           + sect('Specifications', specs, 'A specification is an Artifact that <code>represents</code> a Concept.');
    }
  },
  acceptance: {
    label: 'Acceptance history',
    why: 'The acceptance chain reaching this node. Acceptance confers Active status; commits do not (ADR-0018).',
    render(id){
      const reach = new Set([id, ...closure(id, nid => inc(nid).concat(out(nid))).map(f => f.id)]);
      const records = CKM.nodes.filter(n => n.type === 'AcceptanceRecord'
        && out(n.id).some(e => e.predicate === 'accepts' && reach.has(e.to)));
      if (!records.length) return `<p class="empty">No acceptance record reaches this node.
        Under <code>ADR-0020</code> its revisions are not Active.</p>`;
      return `<div class="tbl-wrap"><table><tr><th>Record</th><th>Accepts</th><th>Reviewer</th></tr>`
        + records.map(r => {
            const acc = out(r.id).filter(e => e.predicate === 'accepts').map(e => link(e.to)).join(', ');
            const rev = out(r.id).filter(e => e.predicate === 'reviewed-by').map(e => link(e.to)).join(', ');
            return `<tr><td>${link(r.id)}</td><td>${acc || '—'}</td><td>${rev || '<span class="empty">none</span>'}</td></tr>`;
          }).join('') + '</table></div>';
    }
  }
};

/* ---- rendering ------------------------------------------------------- */

const groups = {};
CKM.nodes.forEach(n => (groups[n.type] ||= []).push(n));
Object.keys(groups).sort().forEach(type => {
  const h = document.createElement('div'); h.className='grp'; h.textContent=type; nav.appendChild(h);
  groups[type].forEach(n => {
    const b = document.createElement('button');
    b.className = 'node ' + n.family; b.textContent = n.label; b.dataset.id = n.id;
    b.onclick = () => show(n.id); nav.appendChild(b);
  });
});

function show(id, q){
  const n = byId[id]; if (!n) return;
  current = id; query = q || query;
  document.querySelectorAll('button.node').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
  const bar = Object.entries(QUERIES).map(([k, v]) =>
    `<button class="${k === query ? 'on' : ''}" onclick="show('${id}','${k}')">${v.label}</button>`).join('');
  main.innerHTML = `<h2>${esc(n.label)}</h2>
    <p><code>${esc(n.id)}</code> &middot; <span class="pill">${esc(n.type)}</span>
       <span class="pill">${esc(n.family)}</span>
       ${n.position != null ? `<span class="pill">position ${n.position}</span>` : ''}</p>
    <p>${esc(n.description)}</p>
    <div class="qbar">${bar}</div>
    <div class="why">${esc(QUERIES[query].why)}</div>
    ${QUERIES[query].render(id)}`;
  main.scrollTop = 0;
}

function tbl(o){return '<div class="tbl-wrap"><table>' + Object.entries(o).map(([k,v]) =>
  `<tr><td><code>${esc(k)}</code></td><td>${v}</td></tr>`).join('') + '</table></div>'}

main.innerHTML = `<h2>Canonical Knowledge Model</h2>
  <p>${CKM.statistics.nodes} nodes, ${CKM.statistics.edges} edges in <b>${esc(CKM.project)}</b>.
  Every edge was asserted in the sources; none was inferred.</p>
  <h3>Nodes by metamodel type</h3>${tbl(CKM.statistics.byType)}
  <h3>Nodes by family</h3>${tbl(CKM.statistics.byFamily)}
  <h3>Edges by relationship category</h3>${tbl(CKM.statistics.byCategory)}
  <h3>Edges by core relationship type</h3>${tbl(CKM.statistics.byCoreType)}
  <p class="empty">Select a node to explore. Each node answers five questions.</p>`;
</script></body></html>
