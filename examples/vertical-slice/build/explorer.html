const QUERIES = {"Q-impact": {"id": "Q-impact", "question": "What breaks if I change this?", "subject": "required", "rationale": "Anything reachable by an incoming edge depends on this node, directly or transitively. This is the question ADR-0082 names first.\n", "steps": [{"traverse": {"direction": "in", "transitive": true}}]}, "Q-why": {"id": "Q-why", "question": "Why does this relationship exist?", "subject": "required", "output": "edges", "rationale": "Every edge carries its core type and category, and the model carries the vocabulary that defines them. The answer needs no access to the metamodel.\n", "steps": [{"traverse": {"direction": "both", "max-hops": 1}}]}, "Q-rationale": {"id": "Q-rationale", "question": "Which ADR established this, and does that decision still stand?", "subject": "required", "rationale": "An invariant whose establishing decision has been superseded is a finding that no document states.\n", "steps": [{"traverse": {"direction": "in", "core": "establishes", "node-type": "ADR"}}, {"with": {"superseded-by": {"direction": "out", "predicate": "superseded-by"}}}]}, "Q-provenance": {"id": "Q-provenance", "question": "Where did this come from?", "subject": "required", "rationale": "Provenance is carried by the model, not remembered. Source revision is not yet recorded; ADR-0064 wants (artifact-id, revision-id).\n", "steps": [{"select": {"subject": true}}]}, "Q-dependents": {"id": "Q-dependents", "question": "Which Capabilities depend on this?", "subject": "required", "rationale": "A Workflow's dependents are not all direct \u2014 a Capability may reach it only through a shared Skill.\n", "steps": [{"traverse": {"direction": "both", "transitive": true}}, {"keep": {"type": "Capability"}}]}, "Q-tests": {"id": "Q-tests", "question": "Which Tests must change?", "subject": "required", "rationale": "A test is an Artifact that `validates` another. No Test entity exists, and none is needed \u2014 it would introduce no relationship `validates` lacks.\n", "steps": [{"traverse": {"direction": "in", "transitive": true}}, {"keep": {"has-edge": {"direction": "out", "core": "validates"}}}]}, "Q-specifications": {"id": "Q-specifications", "question": "Which Specifications become inconsistent?", "subject": "required", "rationale": "A specification is an Artifact that `represents` a Concept. No Specification entity exists, for the same reason.\n", "steps": [{"traverse": {"direction": "in", "core": "represents"}}]}, "Q-status": {"id": "Q-status", "question": "What is the implementation status?", "subject": "required", "rationale": "Acceptance confers Active status; commits do not (ADR-0018). A revision with no AcceptanceRecord is not Active, whatever the repository says.\n", "steps": [{"traverse": {"direction": "out", "predicate": "has-active-revision", "or-self": true}}, {"with": {"accepted-by": {"direction": "in", "node-type": "AcceptanceRecord"}}}]}, "Q-unenforced": {"id": "Q-unenforced", "question": "Which Invariants have no enforcement point?", "subject": "none", "rationale": "`enforced-at` is zero-or-more by decision. The empty case is the finding \u2014 a rule the domain asserts and nothing checks.\n", "steps": [{"select": {"type": "Invariant"}}, {"reject": {"has-edge": {"direction": "out", "predicate": "enforced-at"}}}]}, "Q-unaccepted": {"id": "Q-unaccepted", "question": "Which revisions are not Active?", "subject": "none", "rationale": "The inverse of Q-status across the whole model. Answers \"what is in this repository that nobody has accepted?\" without reading any document.\n", "steps": [{"select": {"type": "ArtifactRevision"}}, {"reject": {"has-edge": {"direction": "in", "node-type": "AcceptanceRecord"}}}]}, "Q-orphan-concepts": {"id": "Q-orphan-concepts", "question": "Which Concepts does nothing realise or reference?", "subject": "none", "rationale": "A Concept nothing points at is either dead vocabulary or an undocumented dependency. Both are worth surfacing; neither is visible by reading.\n", "steps": [{"select": {"type": "Concept"}}, {"reject": {"has-edge": {"direction": "in"}}}]}};

function edgesOf(id, dir){
  const o = out(id).map(e => [e, e.to]), i = inc(id).map(e => [e, e.from]);
  return dir === 'out' ? o : dir === 'in' ? i : o.concat(i);
}
function edgeMatches(e, other, s){
  if (s.predicate && e.predicate !== s.predicate) return false;
  if (s.core && e.core !== s.core) return false;
  if (s.category && e.category !== s.category) return false;
  if (s['node-type'] && (byId[other]||{}).type !== s['node-type']) return false;
  return true;
}
function mkRow(id, extra){
  const n = byId[id] || {};
  return Object.assign({id, type: n.type, label: n.label}, extra || {});
}
function hasEdge(id, s){
  return edgesOf(id, s.direction || 'out').some(([e, o]) => edgeMatches(e, o, s));
}
function rowMatches(r, s){
  if (s.type) return r.type === s.type;
  if (s['has-edge']) return hasEdge(r.id, s['has-edge']);
  return false;
}
const OPS = {
  select(rows, s, subject){
    if (s.all) return CKM.nodes.map(n => mkRow(n.id));
    if (s.subject) return byId[subject] ? [mkRow(subject)] : [];
    if (s.id) return byId[s.id] ? [mkRow(s.id)] : [];
    if (s.type) return CKM.nodes.filter(n => n.type === s.type).map(n => mkRow(n.id));
    return rows;
  },
  traverse(rows, s, subject){
    const starts = rows.length ? rows.map(r => r.id) : (byId[subject] ? [subject] : []);
    const dir = s.direction || 'out', origin = new Set(starts);
    const seen = new Map(), queue = starts.map(x => [x, 0, null]);
    while (queue.length) {
      const [id, hops, via] = queue.shift();
      if (!s.transitive && hops >= (s['max-hops'] || 1)) continue;
      for (const [e, other] of edgesOf(id, dir)) {
        if (!edgeMatches(e, other, s) || origin.has(other) || seen.has(other)) continue;
        seen.set(other, mkRow(other, {hops: hops + 1, via: via || e.predicate}));
        queue.push([other, hops + 1, via || e.predicate]);
      }
    }
    const outRows = [...seen.values()].sort((a,b) => a.hops - b.hops || a.id.localeCompare(b.id));
    if (!outRows.length && s['or-self'])
      return starts.map(x => mkRow(x, {hops: 0, via: null}));
    return outRows;
  },
  keep(rows, s){ return rows.filter(r => rowMatches(r, s)) },
  reject(rows, s){ return rows.filter(r => !rowMatches(r, s)) },
  with(rows, s){
    rows.forEach(r => Object.entries(s).forEach(([name, sub]) => {
      r[name] = edgesOf(r.id, sub.direction || 'out')
        .filter(([e, o]) => edgeMatches(e, o, sub)).map(([, o]) => o);
    }));
    return rows;
  }
};
function runQuery(q, subject){
  let rows = [];
  for (const step of q.steps)
    for (const [name, spec] of Object.entries(step))
      rows = OPS[name](rows, spec, subject);
  if (q.output === 'edges') {
    const ids = new Set(rows.map(r => r.id));
    if (subject) ids.add(subject);
    return CKM.edges.filter(e => ids.has(e.from) && ids.has(e.to));
  }
  return rows;
}

/* ---- rendering ------------------------------------------------------- */

const groups = {};
CKM.nodes.forEach(n => (groups[n.type] ||= []).push(n));
Object.keys(groups).sort().forEach(type => {
  const h = document.createElement('div'); h.className='grp'; h.textContent=type; nav.appendChild(h);
  groups[type].forEach(n => {
    const b = document.createElement('button');
    b.className = 'node ' + n.family; b.textContent = n.label; b.dataset.id = n.id;
    b.onclick = () => show(n.id); nav.appendChild(b);
  });
});

function renderEdges(edges){
  if (!edges.length) return '<p class="empty">None.</p>';
  return '<div class="tbl-wrap"><table><tr><th>From</th><th>Predicate</th>'
   + '<th>Why it exists</th><th>To</th></tr>'
   + edges.map(e => {
       const v = (CKM.vocabulary || {})[e.core] || {};
       return `<tr><td>${link(e.from)}</td><td><code>${esc(e.predicate)}</code></td>
         <td>${pill(e.category)} specializes <code>${esc(e.core)}</code>
         <div class="hop">${esc(v.means || '')}</div></td>
         <td>${link(e.to)}</td></tr>`;
     }).join('') + '</table></div>';
}
function renderRows(rows){
  if (!rows.length) return '<p class="empty">No results. That is often the finding.</p>';
  const extra = [...new Set(rows.flatMap(r => Object.keys(r)))]
    .filter(k => !['id','type','label'].includes(k));
  return '<div class="tbl-wrap"><table><tr><th>Node</th><th>Type</th>'
   + extra.map(k => `<th>${esc(k)}</th>`).join('') + '</tr>'
   + rows.map(r => `<tr><td>${link(r.id)}</td><td class="hop">${esc(r.type)}</td>`
       + extra.map(k => `<td>${Array.isArray(r[k])
           ? (r[k].length ? r[k].map(link).join(', ') : '<span class="empty">none</span>')
           : (r[k] == null ? '' : esc(r[k]))}</td>`).join('') + '</tr>').join('')
   + '</table></div>';
}
function show(id, q){
  const n = byId[id]; if (!n) return;
  current = id;
  const usable = Object.values(QUERIES).filter(x => x.subject === 'required');
  query = q || (usable.some(x => x.id === query) ? query : usable[0].id);
  document.querySelectorAll('button.node').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
  const bar = usable.map(x =>
    `<button class="${x.id === query ? 'on' : ''}" onclick="show('${id}','${x.id}')">${esc(x.question)}</button>`).join('');
  const active = QUERIES[query];
  const result = runQuery(active, id);
  main.innerHTML = `<h2>${esc(n.label)}</h2>
    <p><code>${esc(n.id)}</code> &middot; <span class="pill">${esc(n.type)}</span>
       <span class="pill">${esc(n.family)}</span>
       ${n.position != null ? `<span class="pill">position ${n.position}</span>` : ''}</p>
    <p>${esc(n.description)}</p>
    <div class="qbar">${bar}</div>
    <h3>${esc(active.question)}</h3>
    <div class="why">${esc((active.rationale || '').trim())}</div>
    ${active.output === 'edges' ? renderEdges(result) : renderRows(result)}
    <p class="hop">${result.length} row(s) &middot; <code>${esc(active.id)}</code> &middot;
    provenance: <code>${esc((n.provenance||{}).source)}</code></p>`;
  main.scrollTop = 0;
}
function showGlobal(qid){
  query = qid;
  document.querySelectorAll('button.node').forEach(b => b.classList.remove('sel'));
  const q = QUERIES[qid], rows = runQuery(q, null);
  main.innerHTML = `<h2>${esc(q.question)}</h2>
    <div class="why">${esc((q.rationale || '').trim())}</div>
    ${renderRows(rows)}
    <p class="hop">${rows.length} row(s) &middot; <code>${esc(q.id)}</code></p>
    <p><a class="link" onclick="home()">&larr; back</a></p>`;
  main.scrollTop = 0;
}
function home(){
  const global = Object.values(QUERIES).filter(q => q.subject === 'none');
  main.innerHTML = `<h2>What are you trying to accomplish?</h2>
  <p>Every answer is computed from the Canonical Knowledge Model. Nothing here was
  written by hand.</p>
  <h3>Ask about the whole system</h3>
  <div class="qbar">${global.map(q =>
    `<button onclick="showGlobal('${q.id}')">${esc(q.question)}</button>`).join('')}</div>
  <h3>Ask about one thing</h3>
  <p class="hop">Select a node on the left, then choose a question.
  ${Object.values(QUERIES).filter(q => q.subject === 'required').length} questions
  are available per node.</p>
  <h3>What is in the model</h3>${tbl(CKM.statistics.byType)}
  <h3>Edges by relationship category</h3>${tbl(CKM.statistics.byCategory)}`;
}
function tbl(o){return '<div class="tbl-wrap"><table>' + Object.entries(o).map(([k,v]) =>
  `<tr><td><code>${esc(k)}</code></td><td>${v}</td></tr>`).join('') + '</table></div>'}
home();
</script></body></html>
