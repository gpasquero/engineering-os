<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Explorer</title>
<style>
:root{--bg:#fff;--fg:#1f1f1f;--mut:#5f6368;--line:#dadce0;--d:#4285f4;--o:#ea4335}
@media(prefers-color-scheme:dark){:root{--bg:#17181a;--fg:#e8eaed;--mut:#9aa0a6;--line:#3c4043}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:var(--bg);color:var(--fg)}
header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.1rem}
.sub{color:var(--mut);font-size:.85rem;margin-top:.25rem}
.wrap{display:grid;grid-template-columns:minmax(230px,300px) 1fr;min-height:calc(100vh - 90px)}
@media(max-width:720px){.wrap{grid-template-columns:1fr}}
nav{border-right:1px solid var(--line);padding:1rem;overflow-y:auto}
main{padding:1.5rem;overflow-x:auto}
.grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:1rem 0 .35rem}
button.node{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;
font:inherit;padding:.3rem .5rem;border-radius:6px;cursor:pointer;border-left:3px solid transparent}
button.node:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
button.node.sel{background:color-mix(in srgb,var(--fg) 12%,transparent);font-weight:600}
button.node.descriptive{border-left-color:var(--d)}
button.node.operational{border-left-color:var(--o)}
.type{color:var(--mut);font-size:.78rem}
table{border-collapse:collapse;margin:.5rem 0 1.5rem;font-size:.9rem;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
code{background:color-mix(in srgb,var(--fg) 8%,transparent);padding:.1rem .35rem;
border-radius:4px;font-size:.85em}
a.link{color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.pill{display:inline-block;font-size:.7rem;padding:.1rem .5rem;border-radius:999px;
border:1px solid var(--line);color:var(--mut)}
.empty{color:var(--mut);font-style:italic}
.tbl-wrap{overflow-x:auto}
</style></head><body>
<header><h1>Knowledge Explorer</h1>
<div class="sub">A projection of the Canonical Knowledge Model, which is the product.
Generated by <code>tools/compile.py</code>; nothing here was written by hand.</div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const CKM = {"metamodelVersion": "0.4.0-skeleton", "note": "Canonical Knowledge Model. Every edge was asserted; none inferred (ADR-0061).", "nodes": [{"id": "ADR.0001", "type": "ADR", "label": "Verify payment synchronously at checkout", "family": "operational", "position": null, "description": "Decision with alternatives considered. Never edited once accepted; superseded."}, {"id": "AcceptanceRecord.0001", "type": "AcceptanceRecord", "label": "Acceptance of checkout service r2", "family": "operational", "position": null, "description": "The act that confers Active status. Commits do not."}, {"id": "Actor.Customer", "type": "Actor", "label": "Customer", "family": "descriptive", "position": null, "description": "The role that submits orders. A role, not a person."}, {"id": "Artifact.CheckoutService", "type": "Artifact", "label": "Checkout service", "family": "descriptive", "position": null, "description": "A stable logical identity. It has no lifecycle of its own."}, {"id": "ArtifactRevision.CheckoutService.r2", "type": "ArtifactRevision", "label": "Checkout service r2", "family": "descriptive", "position": null, "description": "The unit that carries lifecycle state and the unit that is accepted."}, {"id": "BoundedContext.Sales", "type": "BoundedContext", "label": "Sales", "family": "descriptive", "position": null, "description": "The boundary within which \"Order\" means a customer's purchase request."}, {"id": "Capability.PlaceOrder", "type": "Capability", "label": "Place an order", "family": "descriptive", "position": null, "description": "The system accepts an order from a Customer and acknowledges it."}, {"id": "Concept.Order", "type": "Concept", "label": "Order", "family": "descriptive", "position": null, "description": "A customer's request to purchase goods, from submission until fulfilment."}, {"id": "Invariant.PaymentBeforeShipping", "type": "Invariant", "label": "An order cannot ship before payment clears", "family": "descriptive", "position": null, "description": "Stated independently of whatever enforces it. Note that `enforced-at` is absent:\nthis invariant has no recorded enforcement point, which is a finding rather than\nan omission."}, {"id": "Issue.0001", "type": "Issue", "label": "Should payment be verified synchronously?", "family": "operational", "position": null, "description": "A recorded unknown."}, {"id": "Skill.ValidateOrder", "type": "Skill", "label": "Validate an order", "family": "operational", "position": null, "description": "Check that an order references known goods and a reachable customer."}, {"id": "Workflow.Checkout", "type": "Workflow", "label": "Checkout", "family": "operational", "position": null, "description": "Orchestration only. Holds no methodology of its own."}, {"id": "WorkflowStep.Checkout.1", "type": "WorkflowStep", "label": "Checkout step 1", "family": "operational", "position": "1", "description": "The reified association. The position lives here, not on the Skill."}], "edges": [{"from": "ADR.0001", "predicate": "resolves", "to": "Issue.0001", "core": "resolves", "category": "traceability"}, {"from": "AcceptanceRecord.0001", "predicate": "accepts", "to": "ArtifactRevision.CheckoutService.r2", "core": "accepts", "category": "traceability"}, {"from": "AcceptanceRecord.0001", "predicate": "reviewed-by", "to": "Actor.Customer", "core": "accepted-by", "category": "traceability"}, {"from": "Actor.Customer", "predicate": "scoped-to", "to": "BoundedContext.Sales", "core": "contained-by", "category": "structural"}, {"from": "Actor.Customer", "predicate": "uses", "to": "Capability.PlaceOrder", "core": "executes", "category": "behavioral"}, {"from": "Artifact.CheckoutService", "predicate": "has-active-revision", "to": "ArtifactRevision.CheckoutService.r2", "core": "derived-into", "category": "semantic"}, {"from": "ArtifactRevision.CheckoutService.r2", "predicate": "revision-of", "to": "Artifact.CheckoutService", "core": "derives-from", "category": "semantic"}, {"from": "Capability.PlaceOrder", "predicate": "realised-by", "to": "Artifact.CheckoutService", "core": "implemented-by", "category": "structural"}, {"from": "Capability.PlaceOrder", "predicate": "scoped-to", "to": "BoundedContext.Sales", "core": "contained-by", "category": "structural"}, {"from": "Concept.Order", "predicate": "scoped-to", "to": "BoundedContext.Sales", "core": "contained-by", "category": "structural"}, {"from": "Invariant.PaymentBeforeShipping", "predicate": "constrains", "to": "Concept.Order", "core": "governs", "category": "behavioral"}, {"from": "Invariant.PaymentBeforeShipping", "predicate": "scoped-to", "to": "BoundedContext.Sales", "core": "contained-by", "category": "structural"}, {"from": "Skill.ValidateOrder", "predicate": "produces", "to": "Artifact.CheckoutService", "core": "implements", "category": "structural"}, {"from": "Workflow.Checkout", "predicate": "has-step", "to": "WorkflowStep.Checkout.1", "core": "contains", "category": "structural"}, {"from": "WorkflowStep.Checkout.1", "predicate": "executes", "to": "Skill.ValidateOrder", "core": "executes", "category": "behavioral"}, {"from": "WorkflowStep.Checkout.1", "predicate": "step-of", "to": "Workflow.Checkout", "core": "contained-by", "category": "structural"}], "statistics": {"nodes": 13, "edges": 16, "byType": {"ADR": 1, "AcceptanceRecord": 1, "Actor": 1, "Artifact": 1, "ArtifactRevision": 1, "BoundedContext": 1, "Capability": 1, "Concept": 1, "Invariant": 1, "Issue": 1, "Skill": 1, "Workflow": 1, "WorkflowStep": 1}, "byFamily": {"descriptive": 7, "operational": 6}, "byCategory": {"behavioral": 3, "semantic": 2, "structural": 8, "traceability": 3}, "byCoreType": {"accepted-by": 1, "accepts": 1, "contained-by": 5, "contains": 1, "derived-into": 1, "derives-from": 1, "executes": 2, "governs": 1, "implemented-by": 1, "implements": 1, "resolves": 1}}};
const byId = Object.fromEntries(CKM.nodes.map(n => [n.id, n]));
const nav = document.getElementById('nav'), main = document.getElementById('main');
const groups = {};
CKM.nodes.forEach(n => (groups[n.type] ||= []).push(n));
Object.keys(groups).sort().forEach(type => {
  const h = document.createElement('div'); h.className='grp'; h.textContent=type; nav.appendChild(h);
  groups[type].forEach(n => {
    const b=document.createElement('button');
    b.className='node '+n.family; b.textContent=n.label; b.dataset.id=n.id;
    b.onclick=()=>show(n.id); nav.appendChild(b);
  });
});
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function rows(list,dir){
  if(!list.length) return '<p class="empty">None.</p>';
  return '<div class="tbl-wrap"><table><tr><th>Predicate</th><th>Core type</th>'
   +'<th>Category</th><th>'+dir+'</th></tr>'
   +list.map(e=>{const other=dir==='Target'?e.to:e.from,o=byId[other];
     return `<tr><td><code>${esc(e.predicate)}</code></td><td><code>${esc(e.core)}</code></td>`
      +`<td><span class="pill">${esc(e.category)}</span></td>`
      +`<td><a class="link" onclick="show('${other}')">${esc(o?o.label:other)}</a> `
      +`<span class="type">${esc(o?o.type:'')}</span></td></tr>`}).join('')+'</table></div>';
}
function show(id){
  const n=byId[id]; if(!n) return;
  document.querySelectorAll('button.node').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
  main.innerHTML=`<h2>${esc(n.label)}</h2>
    <p><code>${esc(n.id)}</code> &middot; <span class="pill">${esc(n.type)}</span>
       <span class="pill">${esc(n.family)}</span></p>
    <p>${esc(n.description)}</p>
    <h3>Outgoing</h3>${rows(CKM.edges.filter(e=>e.from===id),'Target')}
    <h3>Incoming</h3>${rows(CKM.edges.filter(e=>e.to===id),'Source')}`;
}
function tbl(o){return '<div class="tbl-wrap"><table>'+Object.entries(o).map(([k,v])=>
  `<tr><td><code>${esc(k)}</code></td><td>${v}</td></tr>`).join('')+'</table></div>'}
main.innerHTML=`<h2>Canonical Knowledge Model</h2>
  <p>${CKM.statistics.nodes} nodes, ${CKM.statistics.edges} edges.
  Every edge was asserted in the sources; none was inferred.</p>
  <h3>Nodes by metamodel type</h3>${tbl(CKM.statistics.byType)}
  <h3>Nodes by family</h3>${tbl(CKM.statistics.byFamily)}
  <h3>Edges by relationship category</h3>${tbl(CKM.statistics.byCategory)}
  <h3>Edges by core relationship type</h3>${tbl(CKM.statistics.byCoreType)}
  <p class="empty">Select a node to explore.</p>`;
</script></body></html>
