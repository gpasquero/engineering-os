  - id: Invariant.WebhookTenantResolutionIsAsymmetric
    type: Invariant
    label: >
      Exactly one route carries the tenant in its URL path; every other route
      derives it from the token
    support: S-inferred
    uncertainty: high
    input-evidence:
      - routes[161] — POST /channels/:tenantSlug/:channelType/webhook
      - routes — the remaining 160 carry no tenant identifier in the path
      - tables.agents, tables.tenants — tenant is a column, not a path segment
    assumptions:
      - An inbound webhook cannot present a JWT, so its tenant must be in the URL.
      - That is a deliberate design choice rather than an oversight.
    reasoning: >
      Comparing 161 route facts against each other isolates a single asymmetry.
      The tenant isolation invariant therefore has TWO enforcement paths, and
      only one of them is the one the auth model describes. Nothing in the
      repository records that the webhook path is different.
    why-no-deterministic-rule-found-it: >
      F-rule-insufficient. The fact is present — all 161 routes are extracted.
      Reaching the conclusion requires comparing a route against the distribution
      of all other routes, which no declared rule does.

  - id: Workflow.PhasedDelivery
    type: Workflow
    label: A six-phase delivery workflow, A through F, each ending in a verification gate
    support: S-specified
    uncertainty: medium
    input-evidence:
      - documents — 44 headings matching "Task [A-F].n"
      - documents — 6 headings matching "Phase [A-F] Completion ... Verification"
      - documents/plans/work-plan.md — "ai-desk Phase 1: Work Plan"
    assumptions:
      - The task numbering encodes ordering rather than arbitrary labels.
      - A "Completion ... Verification" document is a gate rather than a report.
    reasoning: >
      Fifty document headings, individually meaningless, describe one engineering
      process when read together: six phases, each with numbered tasks and a
      terminating verification document.
    why-no-deterministic-rule-found-it: >
      F-fact-absent for workflows generally — no rule proposes workflows, and
      `workflows` is a declared gap. The headings ARE extracted, so a rule could
      be written; none was.

