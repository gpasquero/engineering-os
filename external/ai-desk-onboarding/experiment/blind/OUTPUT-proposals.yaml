  - id: BoundedContext.TenantScopedWorkspace
    type: BoundedContext
    label: The whole backend is a single multi-tenant workspace in which tenant identity is a structural column on almost every table rather than a deployment boundary.
    skill: DS-architecture-discovery
    uncertainty: low
    input-evidence:
      - 30 of 34 tables carry a `tenantId` column (packages/backend/src/common/database/schema/*.ts).
      - The 4 exceptions are `tenants` itself (the root aggregate, source schema/tenants.ts), and three tables that are join or credential rows keyed through a parent - `agent_groups` (agentId, groupId, createdAt), `ticket_tags` (ticketId, tagId, createdAt), `refresh_tokens` (agentId, tokenHash, expiresAt, revokedAt).
      - schema.spec.ts contains a describe block literally named "tenant_id presence on tenant-scoped tables" and a case "has tenant_id as not null".
      - tenant-isolation.integration.spec.ts (9 cases) exercises a Postgres role named `aidesk_app` and a per-transaction session variable; env refs distinguish DB_USER/DB_PASSWORD from DB_SYSTEM_USER/DB_SYSTEM_PASSWORD.
      - docs/adr/ADR-0001-multi-tenancy-strategy.md decision field - "Shared Schema + PostgreSQL Row-Level Security".
    reasoning: >
      The tenant column is not an occasional foreign key; it is present on essentially every
      table that holds its own identity, and the three tables that omit it are exactly the ones
      that cannot be orphaned from a tenant-scoped parent. Combined with a dedicated integration
      suite and a separate low-privilege database role, tenancy is a boundary enforced beneath
      the application rather than by application convention. This is the outermost bounded
      context: every other context named below lives inside it.
    population-compared: >
      All 34 tables in the mechanical model; 30 carry tenantId, 4 do not, and each of the 4
      omissions has a structural explanation.

  - id: BoundedContext.TicketCoreAndItsSatellites
    type: BoundedContext
    label: The ticket is the system's aggregate root, but its HTTP namespace is owned by convention across ten modules rather than enforced by one.
    skill: DS-architecture-discovery
    uncertainty: medium
    input-evidence:
      - "`tickets/*` is the largest route family - 39 of 161 routes (24%), against a next-largest family of 10 (`canned-responses`) across 26 distinct top-level route families."
      - Those 39 routes are served by 10 different module directories - ticket (14), watcher (5), tag (4), time-log (4), conversation (3), ticket-link (3), ticket-todo (3), audit-log (1), csat (1), scenario (1).
      - "Two different controllers publish the same URL shape - `GET tickets/:ticketId/audit-log` in packages/backend/src/modules/audit-log/audit-log.controller.ts and `GET tickets/:id/audit-log` in packages/backend/src/modules/ticket/ticket.controller.ts."
      - The `tickets` table is by far the widest - 35 columns, next widest is `conversations` at 22 and `agents` at 18.
      - "Module placement for all 28 module directories: Ticket Core = ticket, conversation, attachment, audit-log, tag, ticket-link, ticket-todo, time-log, watcher, saved-view, ticket-form, custom-field; Identity and Access = auth, agent, role, api-key, tenant; Customer Directory = contact, company; Channel Ingress/Egress = channel; Realtime = realtime, notification; Service Level = sla; Workflow Automation = automation, scenario, canned-response; Routing = group; Feedback = csat. One directory, realtime, publishes no HTTP route at all."
      - "Characterisation of all 26 top-level route families, by shape. Plain tenant-scoped CRUD (create/list/read/update/delete, one owning module each) - companies (5), contacts (6, plus :id/tickets), custom-fields (5), roles (5), automation-rules (5), scenarios (6), sla-policies (5), business-hours (5), ticket-forms (6), canned-responses (10, CRUD plus a folders sub-resource and :id/substitute), saved-views (6, CRUD plus :id/favorite), api-keys (3, create/list/revoke only - no update, consistent with a write-once secret), tags (2 collection-level). Ticket-scoped sub-resources mounted under tickets/* by other modules - ticket-todos (2 detail routes plus 3 under tickets/), time-logs (2 detail routes plus 4 under tickets/ including timer/start and timer/stop), plus watcher, tag, ticket-link, conversation, audit-log, csat, scenario contributions. Command-style (verb-in-path, not CRUD) - tickets/:id/{restore,assign,reopen,spam,unspam,merge,split}, agents/:id/{deactivate,reactivate}, channels/:id/{enable,disable}, notifications/mark-all-read, tickets/:ticketId/execute-scenario/:scenarioId. Singleton/section config - settings (6 - a GET all, a GET :section, and four section-specific PATCHes for general/storage/email/notifications). Identity - auth (4 - login, refresh, logout, and register which is mounted from the tenant module, not the auth module). Self-service - agents/me (GET, PATCH). Binary transfer - attachments (4 - upload, :id/download, ticket/:ticketId, delete). External ingress - channels/:tenantSlug/:channelType/webhook (1). Customer-facing feedback - csat (7 admin survey routes plus csat/respond/:surveyId/:ticketId). Operational - health (1). Environment-scoped - dev/mail (3)."
    reasoning: >
      A quarter of the HTTP surface hangs off one noun, and ten modules mount routes into that
      noun's namespace. Nothing in the mechanical facts shows a gateway or facade that owns
      `tickets/*`; each module registers its own controller under the shared prefix. That makes
      the ticket boundary conventional, not enforced - the duplicated `tickets/:id/audit-log`
      route from two modules is the visible cost. I initially expected `ticket` to own its whole
      namespace; the route sources contradict that, so the claim is about a shared namespace,
      not a single owner.
    population-compared: >
      All 161 routes grouped into 26 top-level families and 28 module directories; tickets/* is
      39 routes across 10 modules, every other family is served by exactly one module.

  - id: BoundedContext.ChannelIngressIsTheUntrustedEdge
    type: BoundedContext
    label: Inbound external traffic enters through the channel module, which is the only place where tenant identity is resolved from the URL instead of from a verified token.
    skill: DS-architecture-discovery
    uncertainty: low
    input-evidence:
      - "`POST channels/:tenantSlug/:channelType/webhook` (packages/backend/src/modules/channel/channel-webhook.controller.ts) is the only route in the model that carries a tenant identifier as a path parameter."
      - channel is the second-largest module directory at 23 files (ticket is 27; median across 28 module dirs is 6).
      - It owns 7 of the 70 test suites - webhook-idempotency.spec.ts, webhook-replay.spec.ts, email-ingest-flow.spec.ts, channel-registry.spec.ts, adapters/email/email-channel.adapter.spec.ts, adapters/email/providers/in-memory-email.provider.spec.ts, adapters/web-chat.adapter.spec.ts, plus correlation/ticket-correlation.service.spec.ts and email/subject-token.service.spec.ts.
      - "Dedicated table `inbound_webhook_events` (id, tenantId, provider, providerEventId, receivedAt, processedAt) exists for no other module."
      - "webhook-idempotency.spec.ts case - \"accepts null tenantId for pre-tenant-resolution claims\" - i.e. an event is recorded before the tenant is known."
      - docs/adr/ADR-0002-channel-abstraction-architecture.md decision - "Adapter Registry Pattern with Normalized Message Model"; channel-registry.spec.ts asserts duplicate-adapter registration throws.
    reasoning: >
      Everywhere else the tenant arrives inside a JWT (jwt-security.spec.ts extracts `tid` from
      the payload). The webhook route takes it from a URL slug, and the idempotency service
      explicitly tolerates a null tenant "pre-tenant-resolution". That is a distinct trust
      boundary with its own persistence, its own registry indirection, and its own correlation
      logic, which is why the module is nearly four times the median size.
    population-compared: >
      All 161 routes (one carries a tenant slug in the path) and all 28 module directories
      (file counts range 3-27, median 6; channel is 23).

  - id: Concept.WidgetIsASeparateTrustZoneFromTheAgentWorkspace
    type: Concept
    label: The embeddable widget and the agent workspace are two client classes with deliberately different limits, and only the widget is excluded from the shared type contract.
    skill: DS-architecture-discovery
    uncertainty: medium
    input-evidence:
      - "Of 4 packages, `packages/widget` declares exactly one dependency - socket.io-client. backend and frontend both depend on `@ai-desk/shared`; widget does not."
      - "throttle.spec.ts asserts two separate trackers - \"AgentThrottle sets limit=100 / ttl=60000 on the agent tracker\", \"WidgetThrottle sets a stricter limit=30 / ttl=60000 on the widget tracker\", and \"widget limit is strictly less than the agent limit (stricter by design)\"."
      - "attachment.service.spec.ts distinguishes the two contexts by quota - \"rejects oversized files for agent context\" and \"rejects oversized files for widget context\" as separate cases."
      - "realtime module (7 files) publishes 0 of the 161 HTTP routes but owns 3 test suites - chat.gateway.spec.ts (widget sessions), agent.gateway.spec.ts (workspace), realtime.e2e.spec.ts."
      - 'docs/plans/tasks/work-plan-widget-task-19.md - "Task C.5: Widget application (Vite + vanilla TypeScript)"; work-plan-backend-task-16.md - "Task C.2: Chat gateway for widget connections".'
    reasoning: >
      The widget reaches the system only over a socket, gets a rate limit under a third of the
      agent limit, has its own attachment size ceiling, and is the one package that does not
      compile against the shared types. Those four independent facts point at the same line -
      the widget is treated as an anonymous end-customer surface, the frontend as an
      authenticated staff surface. No single fact says this.
    population-compared: >
      All 4 packages (backend, frontend, shared, widget); widget is the only one that omits
      @ai-desk/shared and the only one with a single dependency.

