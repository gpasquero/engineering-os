  - id: Concept.TheAuditTrailIsImplementedTwice
    type: Concept
    label: Two independent audit mechanisms coexist - a generic entity audit and a ticket-specific event log - with overlapping storage, services and URLs.
    skill: DS-architecture-discovery
    uncertainty: medium
    input-evidence:
      - "Table `audit_logs` (id, tenantId, agentId, entityType, entityId, action, changes, createdAt) in schema/audit-logs.ts."
      - "Table `ticket_audit_log` (id, tenantId, ticketId, actorId, actorType, eventType, fromValue, toValue, metadata, createdAt) in schema/ticket-audit-log.ts."
      - "Two services with their own suites - audit-log.service.spec.ts (describes - log, listForEntity, computeDiff) and ticket-audit.service.spec.ts (describes - TicketAuditService, cases about JSON-serializing from/to values)."
      - "Two routes at the same address - `GET tickets/:ticketId/audit-log` from audit-log.controller.ts and `GET tickets/:id/audit-log` from ticket.controller.ts."
      - Other modules write to it too - auto-close-extra.spec.ts "records an audit entry", ticket-merge-extra.spec.ts "records a merged audit entry when an audit service is wired", update-assignment-tags.spec.ts has three "records an/a ..." cases.
    reasoning: >
      The generic table stores a `changes` diff keyed by entityType/entityId; the ticket table
      stores a typed from/to transition with an actorType. These are different models of the
      same concern, and both are reachable at the same URL. The phrase "when an audit service is
      wired" in ticket-merge-extra.spec.ts suggests the wiring is optional in at least one path,
      which is what one would expect from an incomplete migration between the two designs.
    population-compared: >
      All 34 tables - audit_logs and ticket_audit_log are the only pair covering the same
      concern; all 161 routes - `tickets/:id/audit-log` is the only path published by two
      different controllers.

