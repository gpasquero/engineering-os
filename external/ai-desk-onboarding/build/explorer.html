*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:var(--bg);color:var(--fg)}
header{padding:1.1rem 1.5rem;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.05rem}
h2{font-size:1.3rem;margin:0 0 .4rem}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
margin:1.6rem 0 .4rem;font-weight:600}
.sub{color:var(--mut);font-size:.84rem;margin-top:.25rem}
.wrap{display:grid;grid-template-columns:minmax(220px,290px) 1fr;min-height:calc(100vh - 88px)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{max-height:40vh}}
nav{border-right:1px solid var(--line);padding:1rem;overflow-y:auto}
main{padding:1.4rem 1.6rem;overflow-x:auto;min-width:0}
.grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:1rem 0 .3rem}
button.node{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;

button.node:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
button.node.sel{background:color-mix(in srgb,var(--acc) 18%,transparent);font-weight:600}
button.node.descriptive{border-left-color:var(--d)}
button.node.operational{border-left-color:var(--o)}
table{border-collapse:collapse;margin:.3rem 0 .6rem;font-size:.9rem;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.42rem .7rem;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
code{background:color-mix(in srgb,var(--fg) 9%,transparent);padding:.08rem .35rem;
border-radius:4px;font-size:.85em}
a.link{color:var(--acc);text-decoration:none;cursor:pointer;border-bottom:1px solid transparent}
a.link:hover{border-bottom-color:currentColor}
.pill{display:inline-block;font-size:.68rem;padding:.08rem .5rem;border-radius:999px;
border:1px solid var(--line);color:var(--mut)}
.pill.structural{border-color:#4285f4;color:#4285f4}
.pill.behavioral{border-color:#ea4335;color:#ea4335}
.pill.semantic{border-color:#a142f4;color:#a142f4}
.pill.traceability{border-color:#0f9d58;color:#0f9d58}
.empty{color:var(--mut);font-style:italic}
.tbl-wrap{overflow-x:auto}
.why{color:var(--mut);font-size:.85rem;margin:.1rem 0 .9rem;padding-left:.8rem;
border-left:2px solid var(--line)}
.hop{color:var(--mut);font-size:.78rem}
.qbar{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 0}
.qbar button{font:inherit;font-size:.82rem;padding:.25rem .7rem;border-radius:999px;
border:1px solid var(--line);background:none;color:inherit;cursor:pointer}
.qbar button:hover{border-color:var(--acc);color:var(--acc)}
.qbar button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}

const QUERIES = {"Q-impact": {"id": "Q-impact", "question": "What breaks if I change this?", "subject": "required", "rationale": "Anything reachable by an incoming edge depends on this node, directly or transitively. This is the question ADR-0082 names first.\n", "steps": [{"traverse": {"direction": "in", "transitive": true}}]}, "Q-why": {"id": "Q-why", "question": "Why does this relationship exist?", "subject": "required", "output": "edges", "rationale": "Every edge carries its core type and category, and the model carries the vocabulary that defines them. The answer needs no access to the metamodel.\n", "steps": [{"traverse": {"direction": "both", "max-hops": 1}}]}, "Q-rationale": {"id": "Q-rationale", "question": "Which ADR established this, and does that decision still stand?", "subject": "required", "applies-to": ["Invariant", "Policy", "Concept", "Capability"], "rationale": "An invariant whose establishing decision has been superseded is a finding that no document states.\n", "steps": [{"traverse": {"direction": "in", "core": "establishes", "node-type": "ADR"}}, {"with": {"superseded-by": {"direction": "out", "predicate": "superseded-by"}}}]}, "Q-provenance": {"id": "Q-provenance", "question": "Where did this come from?", "subject": "required", "rationale": "Provenance is carried by the model, not remembered. Source revision is not yet recorded; ADR-0064 wants (artifact-id, revision-id).\n", "steps": [{"select": {"subject": true}}]}, "Q-dependents": {"id": "Q-dependents", "question": "Which Capabilities depend on this?", "subject": "required", "applies-to": ["Workflow", "Skill", "Artifact", "Concept"], "rationale": "A Workflow's dependents are not all direct \u2014 a Capability may reach it only through a shared Skill.\n", "steps": [{"traverse": {"direction": "both", "transitive": true}}, {"keep": {"type": "Capability"}}]}, "Q-tests": {"id": "Q-tests", "question": "Which Tests must change?", "subject": "required", "rationale": "A test is an Artifact that `validates` another. No Test entity exists, and none is needed \u2014 it would introduce no relationship `validates` lacks.\n", "steps": [{"traverse": {"direction": "in", "transitive": true}}, {"keep": {"has-edge": {"direction": "out", "core": "validates"}}}]}, "Q-specifications": {"id": "Q-specifications", "question": "Which Specifications become inconsistent?", "subject": "required", "applies-to": ["Concept", "Capability", "Invariant"], "rationale": "A specification is an Artifact that `represents` a Concept. No Specification entity exists, for the same reason.\n", "steps": [{"traverse": {"direction": "in", "core": "represents"}}]}, "Q-status": {"id": "Q-status", "question": "What is the implementation status?", "subject": "required", "applies-to": ["Artifact", "ArtifactRevision"], "rationale": "Acceptance confers Active status; commits do not (ADR-0018). A revision with no AcceptanceRecord is not Active, whatever the repository says.\n", "steps": [{"traverse": {"direction": "out", "predicate": "has-active-revision", "or-self": true}}, {"with": {"accepted-by": {"direction": "in", "node-type": "AcceptanceRecord"}}}]}, "Q-constraints": {"id": "Q-constraints", "question": "Which invariants or guarantees constrain this?", "subject": "required", "rationale": "A capability is bounded by what must remain true of it. Answering this requires the constraint to be modelled separately from the thing it constrains, which is why Invariant is its own entity.\n", "steps": [{"traverse": {"direction": "in", "core": "governs", "node-type": "Invariant"}}]}, "Q-evidence": {"id": "Q-evidence", "question": "What evidence supports this, and where does it come from?", "subject": "required", "rationale": "An assertion without a citation is a claim. This is the query that makes \"insufficient evidence\" a visible answer rather than an empty one, and it is how an answer whose support spans several source classes is recognised.\n", "steps": [{"traverse": {"direction": "out", "core": "evidenced-by", "node-type": "Evidence"}}]}, "Q-unsupported": {"id": "Q-unsupported", "question": "Which assertions carry no evidence at all?", "subject": "none", "rationale": "A confident fabricated connection is worse than an incomplete result. This lists every Concept, Capability and Invariant that nothing cites \u2014 the model's own honesty check.\n", "steps": [{"select": {"type": "Invariant"}}, {"reject": {"has-edge": {"direction": "out", "core": "evidenced-by"}}}]}, "Q-assumptions": {"id": "Q-assumptions", "question": "What assumptions does this implementation depend on?", "subject": "required", "applies-to": ["Artifact"], "rationale": "An implementation depends on what must remain true of the concepts it represents. Those constraints are stated elsewhere, by someone else, and an engineer changing the implementation rarely reads them.\n", "steps": [{"select": {"subject": true}}, {"traverse": {"direction": "out", "core": "represents"}}, {"traverse": {"direction": "in", "core": "governs", "node-type": "Invariant"}}]}, "Q-obsolete-decisions": {"id": "Q-obsolete-decisions", "question": "Which decisions became obsolete but are still reflected in code?", "subject": "none", "rationale": "A superseded decision whose established concepts are still implemented is the most expensive kind of stale knowledge: the code is right, the rationale someone will read is wrong, and nothing connects them.\n", "steps": [{"select": {"type": "ADR"}}, {"keep": {"has-edge": {"direction": "out", "predicate": "superseded-by"}}}, {"keep": {"has-path": [{"direction": "out", "core": "establishes"}, {"direction": "in", "core": "represents"}]}}]}, "Q-stale-implementation": {"id": "Q-stale-implementation", "question": "Which implementation artifacts no longer match their original design rationale?", "subject": "none", "rationale": "The same gap seen from the code. An artifact whose represented concept was established by a decision that has since been superseded is implementing a rationale that no longer stands \u2014 and this is the question that required `has-path`, because the filter is two hops away from the row returned.\n", "steps": [{"select": {"type": "Artifact"}}, {"keep": {"has-path": [{"direction": "out", "core": "represents"}, {"direction": "in", "core": "establishes", "node-type": "ADR"}, {"direction": "out", "predicate": "superseded-by"}]}}]}, "Q-unenforced": {"id": "Q-unenforced", "question": "Which Invariants have no enforcement point?", "subject": "none", "rationale": "`enforced-at` is zero-or-more by decision. The empty case is the finding \u2014 a rule the domain asserts and nothing checks.\n", "steps": [{"select": {"type": "Invariant"}}, {"reject": {"has-edge": {"direction": "out", "predicate": "enforced-at"}}}]}, "Q-unaccepted": {"id": "Q-unaccepted", "question": "Which revisions are not Active?", "subject": "none", "rationale": "The inverse of Q-status across the whole model. Answers \"what is in this repository that nobody has accepted?\" without reading any document.\n", "steps": [{"select": {"type": "ArtifactRevision"}}, {"reject": {"has-edge": {"direction": "in", "node-type": "AcceptanceRecord"}}}]}, "Q-orphan-concepts": {"id": "Q-orphan-concepts", "question": "Which Concepts does nothing realise or reference?", "subject": "none", "rationale": "A Concept nothing points at is either dead vocabulary or an undocumented dependency. Both are worth surfacing; neither is visible by reading.\n", "steps": [{"select": {"type": "Concept"}}, {"reject": {"has-edge": {"direction": "in"}}}]}};
const MAX_DEPTH = 16, MAX_RESULTS = 1000;

function edgesOf(id, dir){
  const o = out(id).map(e => [e, e.to, 'out']), i = inc(id).map(e => [e, e.from, 'in']);
  return dir === 'out' ? o : dir === 'in' ? i : o.concat(i);
}
function matchEdge(e, other, s){
  const why = [];
  for (const f of ['predicate','core','category']) {
    if (s[f] != null) { if (e[f] !== s[f]) return null; why.push(f + '=' + e[f]); }
  }
  if (s['node-type'] != null) {
    const a = (byId[other]||{}).type;
    if (a !== s['node-type']) return null;
    why.push('node-type=' + a);
  }
  return why.length ? why : ['any'];
}
function mkRow(id, extra){
  const n = byId[id] || {};
  return Object.assign({id, type: n.type, label: n.label}, extra || {});
}
function hop(e, other, dir, why){
  return {from: e.from, predicate: e.predicate, to: e.to, core: e.core,
          category: e.category, direction: dir, matched: why, reached: other};
}
function pathKey(p){ return JSON.stringify([p.map(h => h.predicate), p.map(h => h.reached)]) }
/* Codepoint order, NOT localeCompare: the Python engine sorts by codepoint and
   parity is a public invariant (ADR-0088 §7). */
function cmp(a, b){ return a < b ? -1 : a > b ? 1 : 0 }
function hasEdge(id, s){
  return edgesOf(id, s.direction || 'out').some(([e, o]) => matchEdge(e, o, s) !== null);
}
function hasPath(id, chain){
  let frontier = new Set([id]);
  for (const s of chain) {
    const next = new Set();
    for (const cur of frontier)
      for (const [e, o] of edgesOf(cur, s.direction || 'out'))
        if (matchEdge(e, o, s) !== null) next.add(o);
    if (!next.size) return false;
    frontier = next;
  }
  return true;
}
function rowMatches(r, s){
  if (s.type != null) return r.type === s.type;
  if (s['has-path'] != null) return hasPath(r.id, s['has-path']);
  return hasEdge(r.id, s['has-edge']);
}
const OPS = {
  select(rows, s, ctx){
    const mk = id => mkRow(id, {hops: 0, origin: id, path: []});
    if (s.all) return CKM.nodes.map(n => mk(n.id));
    if (s.subject) return byId[ctx.subject] ? [mk(ctx.subject)] : [];
    if (s.id) return byId[s.id] ? [mk(s.id)] : [];
    if (s.type) return CKM.nodes.filter(n => n.type === s.type).map(n => mk(n.id));
    return rows;
  },
  traverse(rows, s, ctx){
    const starts = rows.length ? rows.map(r => r.id)
                               : (byId[ctx.subject] ? [ctx.subject] : []);
    const dir = s.direction || 'out';
    const cap = ctx.maxDepth;
    const limit = Math.min((s.transitive ? cap : (s['max-hops'] || 1)) || 1, cap);
    const origin = new Set(starts), best = new Map();
    const queue = starts.map(x => [x, x, 0, []]);
    let truncated = false;
    while (queue.length) {
      const [id, start, hops, path] = queue.shift();
      if (hops >= limit) {
        if (s.transitive && edgesOf(id, dir).length && hops >= cap) truncated = true;
        continue;
      }
      for (const [e, other, edir] of edgesOf(id, dir)) {
        const why = matchEdge(e, other, s);
        if (why === null || origin.has(other)) continue;
        const cand = path.concat([hop(e, other, edir, why)]);
        const prior = best.get(other);
        if (prior && (prior.path.length < cand.length ||
            (prior.path.length === cand.length && pathKey(prior.path) <= pathKey(cand)))) continue;
        best.set(other, mkRow(other, {hops: cand.length, origin: start, path: cand,
                                      via: cand[0].predicate}));
        queue.push([other, start, cand.length, cand]);
      }
    }
    if (truncated) ctx.diagnostics.push({phase: 'projection', source: null,
      message: 'traversal truncated at max-depth ' + cap, rule: ctx.query.id});
    const res = [...best.values()].sort((a,b) => a.hops - b.hops || cmp(a.id, b.id));
    if (!res.length && s['or-self'])
      return starts.map(x => mkRow(x, {hops: 0, origin: x, path: [], via: null}));
    return res;
  },
  keep(rows, s){ return rows.filter(r => rowMatches(r, s)) },
  reject(rows, s){ return rows.filter(r => !rowMatches(r, s)) },
  with(rows, s){
    rows.forEach(r => Object.entries(s).forEach(([name, sub]) => {
      const found = [];
      for (const [e, other, edir] of edgesOf(r.id, sub.direction || 'out')) {
        const why = matchEdge(e, other, sub);
        if (why !== null) found.push({id: other, predicate: e.predicate,
                                      direction: edir, matched: why});
      }
      r[name] = found.sort((a,b) => cmp(a.id, b.id) || cmp(a.predicate, b.predicate));
    }));
    return rows;
  }
};
function applicable(q, subject){
  if (q.subject !== 'required') return null;
  if (!subject) return 'this question requires a subject';
  if (!byId[subject]) return `no node '${subject}' in this model`;
  const allowed = q['applies-to'];
  if (allowed && !allowed.includes(byId[subject].type))
    return `applies to ${allowed.join(', ')}; ${subject} is a ${byId[subject].type}`;
  return null;
}
function runQuery(q, subject){
  const result = {query: q.id, question: q.question, subject: subject || null,
                  status: 'ok', rows: [], edges: [], diagnostics: []};
  const reason = applicable(q, subject);
  if (reason) {
    result.status = 'not-applicable';
    result.diagnostics = [{phase: 'projection', message: reason, rule: q.id}];
    return result;
  }
  const ctx = {subject, query: q, diagnostics: [], maxDepth: q['max-depth'] || MAX_DEPTH};
  let rows = [];
  for (const step of q.steps) {
    const name = Object.keys(step)[0];
    rows = OPS[name](rows, step[name] || {}, ctx);
  }
  const limit = q['max-results'] || MAX_RESULTS;
  if (rows.length > limit) {
    ctx.diagnostics.push({phase: 'projection', source: null,
      message: `result truncated at max-results ${limit} (${rows.length} found)`, rule: q.id});
    rows = rows.slice(0, limit);
  }
  const mode = q.output || 'nodes';
  if (mode === 'edges') {
    const seen = new Set();
    rows.forEach(r => r.path.forEach(h => {
      const k = h.from + '|' + h.predicate + '|' + h.to;
      if (!seen.has(k)) { seen.add(k); result.edges.push(h); }
    }));
  } else if (mode === 'induced-subgraph') {
    const ids = new Set(rows.map(r => r.id));
    if (subject) ids.add(subject);
    result.edges = CKM.edges.filter(e => ids.has(e.from) && ids.has(e.to));
  }
  result.rows = rows;
  result.diagnostics = ctx.diagnostics;
  if (!rows.length && !result.edges.length) result.status = 'empty';
  return result;
}

/* ---- rendering ------------------------------------------------------- */

const groups = {};
CKM.nodes.forEach(n => (groups[n.type] ||= []).push(n));
Object.keys(groups).sort().forEach(type => {
  const h = document.createElement('div'); h.className='grp'; h.textContent=type; nav.appendChild(h);
  groups[type].forEach(n => {
    const b = document.createElement('button');
    b.className = 'node ' + n.family; b.textContent = n.label; b.dataset.id = n.id;
    b.onclick = () => show(n.id); nav.appendChild(b);
  });
});

function renderEdges(edges){
  if (!edges.length) return '<p class="empty">None.</p>';
  return '<div class="tbl-wrap"><table><tr><th>From</th><th>Predicate</th>'
   + '<th>Why it exists</th><th>To</th></tr>'
   + edges.map(e => {
       const v = (CKM.vocabulary || {})[e.core] || {};
       return `<tr><td>${link(e.from)}</td><td><code>${esc(e.predicate)}</code></td>
         <td>${pill(e.category)} specializes <code>${esc(e.core)}</code>
         <div class="hop">${esc(v.means || '')}</div></td>
         <td>${link(e.to)}</td></tr>`;
     }).join('') + '</table></div>';
}
function renderAttributes(n){
  const a = n.attributes || {};
  const keys = Object.keys(a).sort();
  if (!keys.length) return '<p class="empty">No provenance recorded for this node.</p>';
  return '<div class="tbl-wrap"><table>' + keys.map(k => {
    const v = a[k];
    const cell = /^https?:\/\//.test(v)
      ? `<a class="link" href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`
      : esc(v);
    return `<tr><th>${esc(k)}</th><td>${cell}</td></tr>`;
  }).join('') + '</table></div>';
}
function renderPath(path){
  if (!path || !path.length) return '<span class="hop">start</span>';
  return path.map(h => `<div class="hop"><code>${esc(h.from)}</code> &mdash;
    <b>${esc(h.predicate)}</b> (${esc(h.direction)}) &rarr;
    <code>${esc(h.to)}</code> <i>${esc(h.matched.join(', '))}</i></div>`).join('');
}
function renderResult(res){
  if (res.status === 'not-applicable')
    return `<p class="empty"><b>Not applicable.</b> ${esc(res.diagnostics[0].message)}</p>`;
  const diag = res.diagnostics.length
    ? `<p class="empty">${res.diagnostics.map(d => esc(d.message)).join('; ')}</p>` : '';
  const body = (res.query && QUERIES[res.query] || {}).output === 'edges'
    ? renderEdges(res.edges) : renderRows(res.rows);
  return diag + body;
}
function renderRows(rows){
  if (!rows.length) return '<p class="empty">No results. That is often the finding.</p>';
  const extra = [...new Set(rows.flatMap(r => Object.keys(r)))]
    .filter(k => !['id','type','label','path','via','origin'].includes(k));
  const cell = v => Array.isArray(v)
    ? (v.length ? v.map(x => typeof x === 'object'
        ? `${link(x.id)} <span class="hop">${esc(x.predicate)}</span>` : link(x)).join('<br/>')
      : '<span class="empty">none</span>')
    : (v == null ? '' : esc(v));
  return '<div class="tbl-wrap"><table><tr><th>Node</th><th>Type</th><th>Path</th>'
   + extra.map(k => `<th>${esc(k)}</th>`).join('') + '</tr>'
   + rows.map(r => `<tr><td>${link(r.id)}</td><td class="hop">${esc(r.type)}</td>
       <td>${renderPath(r.path)}</td>`
       + extra.map(k => `<td>${cell(r[k])}</td>`).join('') + '</tr>').join('')
   + '</table></div>';
}
function show(id, q){
  const n = byId[id]; if (!n) return;
  current = id;
  const usable = Object.values(QUERIES).filter(x => x.subject === 'required');
  query = q || (usable.some(x => x.id === query) ? query : usable[0].id);
  document.querySelectorAll('button.node').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
  const bar = usable.map(x =>
    `<button class="${x.id === query ? 'on' : ''}" onclick="show('${id}','${x.id}')">${esc(x.question)}</button>`).join('');
  const active = QUERIES[query];
  const res = runQuery(active, id);
  main.innerHTML = `<h2>${esc(n.label)}</h2>
    <p><code>${esc(n.id)}</code> &middot; <span class="pill">${esc(n.type)}</span>
       <span class="pill">${esc(n.family)}</span>
       ${n.position != null ? `<span class="pill">position ${n.position}</span>` : ''}</p>
    <p>${esc(n.description)}</p>
    ${renderAttributes(n)}
    <div class="qbar">${bar}</div>
    <h3>${esc(active.question)}</h3>
    <div class="why">${esc((active.rationale || '').trim())}</div>
    ${renderResult(res)}
    <p class="hop">status <b>${esc(res.status)}</b> &middot; ${res.rows.length} row(s),
    ${res.edges.length} edge(s) &middot; <code>${esc(active.id)}</code> &middot;
    provenance: <code>${esc((n.provenance||{}).source)}</code></p>`;
  main.scrollTop = 0;
}
function showGlobal(qid){
  query = qid;
  document.querySelectorAll('button.node').forEach(b => b.classList.remove('sel'));
  const q = QUERIES[qid], res = runQuery(q, null);
  main.innerHTML = `<h2>${esc(q.question)}</h2>
    <div class="why">${esc((q.rationale || '').trim())}</div>
    ${renderResult(res)}
    <p class="hop">status <b>${esc(res.status)}</b> &middot; ${res.rows.length} row(s)
    &middot; <code>${esc(q.id)}</code></p>
    <p><a class="link" onclick="home()">&larr; back</a></p>`;
  main.scrollTop = 0;
}
function home(){
  const global = Object.values(QUERIES).filter(q => q.subject === 'none');
  main.innerHTML = `<h2>What are you trying to accomplish?</h2>
  <p>Every answer is computed from the Canonical Knowledge Model. Nothing here was
  written by hand.</p>
  <h3>Ask about the whole system</h3>
  <div class="qbar">${global.map(q =>
    `<button onclick="showGlobal('${q.id}')">${esc(q.question)}</button>`).join('')}</div>
  <h3>Ask about one thing</h3>
  <p class="hop">Select a node on the left, then choose a question.
  ${Object.values(QUERIES).filter(q => q.subject === 'required').length} questions
  are available per node.</p>
  <h3>What is in the model</h3>${tbl(CKM.statistics.byType)}
  <h3>Edges by relationship category</h3>${tbl(CKM.statistics.byCategory)}`;
}
function tbl(o){return '<div class="tbl-wrap"><table>' + Object.entries(o).map(([k,v]) =>
  `<tr><td><code>${esc(k)}</code></td><td>${v}</td></tr>`).join('') + '</table></div>'}
home();
</script></body></html>
